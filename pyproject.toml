[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glee-agent"
version = "1.0.0"
description = "A data-driven negotiation agent for the GLEE economic games (bargaining, negotiation, persuasion)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noam Shadmi" }]
dependencies = [
    "flask>=3.0",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn==1.9.1",   # the shipped models are pickled with this version
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyarrow>=15", "matplotlib>=3.8"]

[project.scripts]
glee-agent = "glee_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
